version: 2

models:
  - name: dim_produto
    description: >
      Dimensão de produtos da Adventure Works. Uma linha por produto,
      com atributos de identificação e preço.
    columns:
      - name: produto_id
        description: Chave primária da dimensão produto.
        tests:
          - unique
          - not_null

      - name: produto_nome
        description: Nome comercial do produto.

      - name: produto_numero
        description: Código/SKU interno do produto.

      - name: custo_padrao
        description: Custo padrão de produção/aquisição do produto.

      - name: preco_lista
        description: Preço de lista (tabela) do produto.